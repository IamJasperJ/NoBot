services:
  nobot:
    image: nobot:local
    build:
      context: .
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.4.3-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        # Dockerfile 首行的构建前端（docker/dockerfile）也要从 Docker Hub 拉；连不上时在 .env 里换成镜像源
        BUILDKIT_SYNTAX: ${BUILDKIT_SYNTAX:-docker/dockerfile:1.7}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /app/data
      # 首次启动从 .env 读取管理员密码，至少 8 位；创建成功后可移除密码变量。
      NOBOT_ADMIN_USERNAME: ${NOBOT_ADMIN_USERNAME:-admin}
      NOBOT_ADMIN_PASSWORD: ${NOBOT_ADMIN_PASSWORD:-}
      # 忘记密码时临时设为 1，重启恢复管理员后立即改回 0。
      NOBOT_ADMIN_RESET: ${NOBOT_ADMIN_RESET:-0}
      # 只有受信任的反向代理能覆盖客户端 IP 时才设为 1。
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 留空时直连；代理只作用于遵循这些环境变量的出站请求。
      HTTP_PROXY: ${NOBOT_PROXY:-}
      HTTPS_PROXY: ${NOBOT_PROXY:-}
      http_proxy: ${NOBOT_PROXY:-}
      https_proxy: ${NOBOT_PROXY:-}
      NO_PROXY: ${NOBOT_NO_PROXY:-localhost,127.0.0.1,::1}
      no_proxy: ${NOBOT_NO_PROXY:-localhost,127.0.0.1,::1}
    ports:
      # 默认只允许本机访问；
      - '${NOBOT_BIND_IP:-127.0.0.1}:${NOBOT_PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
